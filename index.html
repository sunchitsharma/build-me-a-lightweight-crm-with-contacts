<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smiley Logo</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f0f2f5;
  }
  .logo {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: #ffdf00;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
  }
  .logo span {
    font-size: 90px;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="logo" aria-label="Smiley logo">
    <span role="img" aria-label="Smiley">😊</span>
  </div>
</body>
</html>
